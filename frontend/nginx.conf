server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Servir los archivos estáticos de React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Redirigir las peticiones de la API al backend de Docker
    location /api/ {
        # 'backend' es el nombre del servicio en tu docker-compose.yml
        proxy_pass http://backend:8000/;
        
        # Cabeceras necesarias para que FastAPI sepa quién hace la petición
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}