name: CI

on:
  pull_request:
    branches: [testing, main]
  workflow_call: # permite que los workflows de despliegue lo reutilicen

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend (pytest + Postgres 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tickets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tickets_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr tests
        run: pytest

  frontend-build:
    name: Frontend (build de React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

  docker-build:
    name: Docker (construir imágenes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Construir imagen del backend
        run: docker build -t tickets-backend:ci ./backend

      - name: Construir imagen del frontend
        run: docker build -t tickets-frontend:ci --build-arg VITE_API_URL=/api ./frontend