services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD, crea el archivo .env en la raiz}
      POSTGRES_DB: ${POSTGRES_DB:-tickets_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Los .sql se ejecutan en orden alfabético SOLO la primera vez (con el volumen vacío)
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432" # 5433 en tu PC para no chocar con tu Postgres local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tickets_db}
      CORS_ORIGINS: "*" 
      # http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8000"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata: